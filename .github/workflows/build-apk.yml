name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Create project files
        run: |
          cat > settings.gradle.kts <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "p2p-messenger"
          include(":app")
          EOF
          cat > build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application") version "8.7.3" apply false
              id("org.jetbrains.kotlin.android") version "2.0.21" apply false
          }
          EOF
          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=false
          kotlin.code.style=official
          android.nonTransitiveRClass=true
          EOF
          mkdir -p app
          cat > app/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }

          android {
              namespace = "com.example.p2pchat"
              compileSdk = 35

              defaultConfig {
                  applicationId = "com.example.p2pchat"
                  minSdk = 24
                  targetSdk = 34
                  versionCode = 1
                  versionName = "1.0"
              }

              buildTypes {
                  release {
                      isMinifyEnabled = false
                  }
              }

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }

              kotlinOptions {
                  jvmTarget = "17"
              }
          }
          EOF
          mkdir -p app/src/main
          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
              <uses-permission android:name="android.permission.ACCESS_WIFI_STATE" />

              <application
                  android:allowBackup="false"
                  android:label="P2P Чат"
                  android:theme="@android:style/Theme.Material.NoActionBar">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:configChanges="orientation|screenSize|screenLayout|keyboardHidden|smallestScreenSize|uiMode"
                      android:windowSoftInputMode="adjustResize">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>

              </application>

          </manifest>
          EOF
          mkdir -p app/src/main/java/com/example/p2pchat
          cat > app/src/main/java/com/example/p2pchat/PeerNode.kt <<'EOF'
          package com.example.p2pchat

          import java.io.DataInputStream
          import java.io.DataOutputStream
          import java.net.InetSocketAddress
          import java.net.ServerSocket
          import java.net.Socket
          import java.util.concurrent.CopyOnWriteArrayList
          import kotlin.concurrent.thread

          /**
           * Узел P2P: одновременно и сервер (принимает входящие), и клиент (подключается к другим).
           * Протокол: на каждое сообщение — строка UTF (DataOutputStream.writeUTF).
           *   "HELLO:<имя>"  — представление при подключении
           *   "MSG:<текст>"  — сообщение
           */
          class PeerNode(
              private val port: Int,
              private val onEvent: (String) -> Unit,
              private val onMessage: (from: String, text: String, mine: Boolean) -> Unit
          ) {
              @Volatile
              var myName: String = "Аноним"

              @Volatile
              private var server: ServerSocket? = null

              @Volatile
              private var running = false

              private val peers = CopyOnWriteArrayList<Peer>()

              private class Peer(val socket: Socket) {
                  val input = DataInputStream(socket.getInputStream().buffered())
                  val output = DataOutputStream(socket.getOutputStream().buffered())

                  @Volatile
                  var name: String = socket.inetAddress?.hostAddress ?: "?"

                  fun send(text: String) {
                      synchronized(output) {
                          output.writeUTF(text)
                          output.flush()
                      }
                  }
              }

              fun peerCount(): Int = peers.size

              fun start() {
                  if (running) return
                  running = true
                  thread(isDaemon = true, name = "p2p-accept") {
                      try {
                          val ss = ServerSocket(port)
                          server = ss
                          onEvent("Слушаю порт $port")
                          while (running) {
                              val socket = ss.accept()
                              handle(socket)
                          }
                      } catch (e: Exception) {
                          if (running) onEvent("Ошибка сервера: ${e.message}")
                      }
                  }
              }

              fun connect(host: String) {
                  thread(isDaemon = true, name = "p2p-connect") {
                      try {
                          onEvent("Подключаюсь к $host…")
                          val socket = Socket()
                          socket.connect(InetSocketAddress(host, port), 5000)
                          handle(socket)
                      } catch (e: Exception) {
                          onEvent("Не удалось подключиться к $host: ${e.message}")
                      }
                  }
              }

              fun send(text: String) {
                  if (peers.isEmpty()) {
                      onEvent("Нет подключённых собеседников")
                      return
                  }
                  thread(isDaemon = true, name = "p2p-send") {
                      var delivered = false
                      for (p in peers) {
                          try {
                              p.send("MSG:$text")
                              delivered = true
                          } catch (e: Exception) {
                              onEvent("Не доставлено ${p.name}: ${e.message}")
                          }
                      }
                      if (delivered) onMessage(myName, text, true)
                  }
              }

              private fun handle(socket: Socket) {
                  thread(isDaemon = true, name = "p2p-peer") {
                      var peer: Peer? = null
                      try {
                          socket.keepAlive = true
                          socket.tcpNoDelay = true
                          val p = Peer(socket)
                          peer = p
                          peers.add(p)
                          p.send("HELLO:$myName")
                          while (running) {
                              val line = p.input.readUTF()
                              when {
                                  line.startsWith("HELLO:") -> {
                                      p.name = line.removePrefix("HELLO:").ifBlank { p.name }
                                      onEvent("Подключён: ${p.name}")
                                  }
                                  line.startsWith("MSG:") -> {
                                      onMessage(p.name, line.removePrefix("MSG:"), false)
                                  }
                              }
                          }
                      } catch (e: Exception) {
                          // соединение закрыто или оборвалось
                      } finally {
                          peer?.let {
                              peers.remove(it)
                              onEvent("Отключён: ${it.name}")
                          }
                          try {
                              socket.close()
                          } catch (_: Exception) {
                          }
                      }
                  }
              }

              fun stop() {
                  running = false
                  try {
                      server?.close()
                  } catch (_: Exception) {
                  }
                  for (p in peers) {
                      try {
                          p.socket.close()
                      } catch (_: Exception) {
                      }
                  }
                  peers.clear()
              }
          }
          EOF
          mkdir -p app/src/main/java/com/example/p2pchat
          cat > app/src/main/java/com/example/p2pchat/MainActivity.kt <<'EOF'
          package com.example.p2pchat

          import android.animation.ValueAnimator
          import android.app.Activity
          import android.content.Context
          import android.graphics.Canvas
          import android.graphics.Color
          import android.graphics.LinearGradient
          import android.graphics.Paint
          import android.graphics.RadialGradient
          import android.graphics.Shader
          import android.graphics.Typeface
          import android.graphics.drawable.ColorDrawable
          import android.graphics.drawable.GradientDrawable
          import android.os.Bundle
          import android.text.Editable
          import android.text.InputType
          import android.text.TextWatcher
          import android.view.Gravity
          import android.view.HapticFeedbackConstants
          import android.view.MotionEvent
          import android.view.View
          import android.view.ViewGroup
          import android.view.animation.LinearInterpolator
          import android.widget.BaseAdapter
          import android.widget.EditText
          import android.widget.FrameLayout
          import android.widget.LinearLayout
          import android.widget.ListView
          import android.widget.TextView
          import java.net.Inet4Address
          import java.net.NetworkInterface
          import java.text.SimpleDateFormat
          import java.util.Date
          import java.util.Locale
          import kotlin.math.cos
          import kotlin.math.max
          import kotlin.math.sin

          private const val KIND_ME = 0
          private const val KIND_OTHER = 1
          private const val KIND_SYSTEM = 2

          data class ChatItem(val kind: Int, val sender: String, val text: String, val time: String)

          /** Живой фон: тёмный градиент с мягко плывущими цветными пятнами света. */
          class GlassBackgroundView(context: Context) : View(context) {

              private class Orb(
                  val cx: Float,
                  val cy: Float,
                  val r: Float,
                  val color: Int,
                  val dx: Float,
                  val dy: Float,
                  val phase: Float
              )

              private val paint = Paint(Paint.ANTI_ALIAS_FLAG)
              private var t = 0f
              private var animator: ValueAnimator? = null

              private val orbs = listOf(
                  Orb(0.15f, 0.12f, 0.45f, 0xFF7C4DFF.toInt(), 0.10f, 0.06f, 0f),
                  Orb(0.90f, 0.35f, 0.40f, 0xFF00B8D4.toInt(), -0.12f, 0.08f, 1.5f),
                  Orb(0.25f, 0.85f, 0.50f, 0xFFFF4081.toInt(), 0.10f, -0.07f, 3.0f),
                  Orb(0.80f, 0.95f, 0.38f, 0xFF3D5AFE.toInt(), -0.08f, -0.05f, 4.5f)
              )

              private fun withAlpha(color: Int, alpha: Int): Int =
                  (color and 0x00FFFFFF) or (alpha shl 24)

              override fun onDraw(canvas: Canvas) {
                  val w = width.toFloat()
                  val h = height.toFloat()
                  if (w <= 0f || h <= 0f) return

                  paint.shader = LinearGradient(
                      0f, 0f, w, h,
                      intArrayOf(0xFF0B0D2A.toInt(), 0xFF1B1550.toInt(), 0xFF0A2744.toInt()),
                      null,
                      Shader.TileMode.CLAMP
                  )
                  canvas.drawRect(0f, 0f, w, h, paint)

                  val unit = max(w, h)
                  for (o in orbs) {
                      val ang = (t * 2.0 * Math.PI).toFloat() + o.phase
                      val x = (o.cx + o.dx * sin(ang)) * w
                      val y = (o.cy + o.dy * cos(ang)) * h
                      val r = o.r * unit
                      paint.shader = RadialGradient(
                          x, y, r,
                          intArrayOf(withAlpha(o.color, 0x90), withAlpha(o.color, 0x00)),
                          null,
                          Shader.TileMode.CLAMP
                      )
                      canvas.drawCircle(x, y, r, paint)
                  }
                  paint.shader = null
              }

              override fun onAttachedToWindow() {
                  super.onAttachedToWindow()
                  animator = ValueAnimator.ofFloat(0f, 1f).apply {
                      duration = 40000
                      repeatCount = ValueAnimator.INFINITE
                      interpolator = LinearInterpolator()
                      addUpdateListener {
                          t = it.animatedValue as Float
                          invalidate()
                      }
                      start()
                  }
              }

              override fun onDetachedFromWindow() {
                  animator?.cancel()
                  animator = null
                  super.onDetachedFromWindow()
              }

              override fun onWindowVisibilityChanged(visibility: Int) {
                  super.onWindowVisibilityChanged(visibility)
                  if (visibility == VISIBLE) animator?.resume() else animator?.pause()
              }
          }

          class MainActivity : Activity() {

              companion object {
                  const val PORT = 8888
                  const val MAX_LEN = 2000
              }

              private lateinit var node: PeerNode
              private lateinit var chat: ChatAdapter
              private lateinit var statusPill: TextView
              private lateinit var chevron: TextView
              private lateinit var connCard: View

              private var lastPeerCount = 0
              private val timeFmt = SimpleDateFormat("HH:mm", Locale.getDefault())

              private val density: Float get() = resources.displayMetrics.density

              private fun dp(v: Float): Float = v * density
              private fun dpI(v: Int): Int = (v * density + 0.5f).toInt()
              private fun col(v: Long): Int = v.toInt()

              // ---------- стили ----------

              private fun glass(
                  radiusDp: Float,
                  c1: Int = col(0x40FFFFFF),
                  c2: Int = col(0x12FFFFFF),
                  stroke: Int = col(0x66FFFFFF)
              ): GradientDrawable =
                  GradientDrawable(GradientDrawable.Orientation.TL_BR, intArrayOf(c1, c2)).apply {
                      cornerRadius = dp(radiusDp)
                      setStroke(dpI(1), stroke)
                  }

              private fun bubbleBg(mine: Boolean): GradientDrawable {
                  val r = dp(20f)
                  val s = dp(6f)
                  return if (mine) {
                      GradientDrawable(
                          GradientDrawable.Orientation.TL_BR,
                          intArrayOf(col(0xE64D7CFF), col(0xE68B5CFF))
                      ).apply {
                          cornerRadii = floatArrayOf(r, r, r, r, s, s, r, r)
                          setStroke(dpI(1), col(0x66FFFFFF))
                      }
                  } else {
                      GradientDrawable(
                          GradientDrawable.Orientation.TL_BR,
                          intArrayOf(col(0x3DFFFFFF), col(0x1AFFFFFF))
                      ).apply {
                          cornerRadii = floatArrayOf(s, s, r, r, r, r, r, r)
                          setStroke(dpI(1), col(0x4DFFFFFF))
                      }
                  }
              }

              private fun lp(
                  w: Int,
                  h: Int,
                  weight: Float = 0f,
                  l: Int = 0,
                  t: Int = 0,
                  r: Int = 0,
                  b: Int = 0
              ): LinearLayout.LayoutParams =
                  LinearLayout.LayoutParams(w, h, weight).apply { setMargins(l, t, r, b) }

              /** Лёгкая «жидкая» анимация нажатия. */
              private fun View.addPress() {
                  setOnTouchListener { v, e ->
                      when (e.actionMasked) {
                          MotionEvent.ACTION_DOWN ->
                              v.animate().scaleX(0.94f).scaleY(0.94f).setDuration(80).start()
                          MotionEvent.ACTION_UP, MotionEvent.ACTION_CANCEL ->
                              v.animate().scaleX(1f).scaleY(1f).setDuration(160).start()
                      }
                      false
                  }
              }

              private fun field(hintText: String): EditText = EditText(this).apply {
                  hint = hintText
                  setHintTextColor(col(0x80FFFFFF))
                  setTextColor(Color.WHITE)
                  textSize = 15f
                  setSingleLine()
                  setPadding(dpI(14), dpI(10), dpI(14), dpI(10))
                  background = GradientDrawable().apply {
                      setColor(col(0x22FFFFFF))
                      cornerRadius = dp(18f)
                      setStroke(dpI(1), col(0x40FFFFFF))
                  }
              }

              private fun pill(label: String, c1: Int, c2: Int): TextView = TextView(this).apply {
                  text = label
                  textSize = 15f
                  setTextColor(Color.WHITE)
                  setTypeface(typeface, Typeface.BOLD)
                  gravity = Gravity.CENTER
                  setPadding(dpI(18), dpI(10), dpI(18), dpI(10))
                  background = GradientDrawable(
                      GradientDrawable.Orientation.TL_BR,
                      intArrayOf(c1, c2)
                  ).apply {
                      cornerRadius = dp(20f)
                      setStroke(dpI(1), col(0x66FFFFFF))
                  }
                  isClickable = true
                  addPress()
              }

              // ---------- экран ----------

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)

                  window.statusBarColor = col(0xFF0B0D2A)
                  window.navigationBarColor = col(0xFF0A2744)

                  val prefs = getSharedPreferences("p2p", Context.MODE_PRIVATE)
                  val match = ViewGroup.LayoutParams.MATCH_PARENT
                  val wrap = ViewGroup.LayoutParams.WRAP_CONTENT

                  val frame = FrameLayout(this)
                  frame.addView(GlassBackgroundView(this), FrameLayout.LayoutParams(match, match))

                  val content = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setPadding(dpI(12), dpI(10), dpI(12), dpI(10))
                  }
                  frame.addView(content, FrameLayout.LayoutParams(match, match))

                  // --- шапка ---
                  val header = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setPadding(dpI(18), dpI(14), dpI(18), dpI(14))
                      background = glass(28f)
                  }
                  val titleRow = LinearLayout(this).apply {
                      orientation = LinearLayout.HORIZONTAL
                      gravity = Gravity.CENTER_VERTICAL
                  }
                  val title = TextView(this).apply {
                      text = "P2P Чат"
                      textSize = 22f
                      setTextColor(Color.WHITE)
                      setTypeface(typeface, Typeface.BOLD)
                  }
                  statusPill = TextView(this).apply {
                      textSize = 13f
                      setPadding(dpI(12), dpI(5), dpI(12), dpI(5))
                      background = glass(16f, col(0x33FFFFFF), col(0x14FFFFFF), col(0x4DFFFFFF))
                  }
                  chevron = TextView(this).apply {
                      textSize = 16f
                      setTextColor(col(0xB3FFFFFF))
                      setPadding(dpI(10), 0, 0, 0)
                  }
                  titleRow.addView(title, LinearLayout.LayoutParams(0, wrap, 1f))
                  titleRow.addView(statusPill, LinearLayout.LayoutParams(wrap, wrap))
                  titleRow.addView(chevron, LinearLayout.LayoutParams(wrap, wrap))

                  val ipInfo = TextView(this).apply {
                      text = "Мой IP: ${localIps()} · порт $PORT"
                      textSize = 13f
                      setTextColor(col(0xB3FFFFFF))
                      setTextIsSelectable(true)
                  }
                  header.addView(titleRow, lp(match, wrap))
                  header.addView(ipInfo, lp(match, wrap, t = dpI(4)))
                  content.addView(header, lp(match, wrap))

                  // --- карточка подключения ---
                  val card = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setPadding(dpI(14), dpI(14), dpI(14), dpI(14))
                      background = glass(24f)
                  }
                  connCard = card

                  val nameInput = field("Ваше имя").apply {
                      setText(prefs.getString("name", ""))
                  }
                  val peerInput = field("IP собеседника").apply {
                      inputType = InputType.TYPE_CLASS_TEXT or InputType.TYPE_TEXT_VARIATION_URI
                      setText(prefs.getString("peer", ""))
                  }
                  val connectBtn = pill("Подключить", col(0xFF4D7CFF), col(0xFF8B5CFF))

                  val peerRow = LinearLayout(this).apply {
                      orientation = LinearLayout.HORIZONTAL
                      gravity = Gravity.CENTER_VERTICAL
                  }
                  peerRow.addView(peerInput, LinearLayout.LayoutParams(0, wrap, 1f))
                  peerRow.addView(connectBtn, lp(wrap, wrap, l = dpI(8)))

                  card.addView(nameInput, lp(match, wrap))
                  card.addView(peerRow, lp(match, wrap, t = dpI(10)))
                  content.addView(card, lp(match, wrap, t = dpI(10)))

                  // --- список сообщений ---
                  chat = ChatAdapter()
                  val list = ListView(this).apply {
                      this.adapter = chat
                      divider = null
                      dividerHeight = 0
                      selector = ColorDrawable(Color.TRANSPARENT)
                      cacheColorHint = Color.TRANSPARENT
                      isVerticalScrollBarEnabled = false
                      overScrollMode = View.OVER_SCROLL_NEVER
                      transcriptMode = ListView.TRANSCRIPT_MODE_ALWAYS_SCROLL
                      isStackFromBottom = true
                      clipToPadding = false
                      setPadding(0, dpI(8), 0, dpI(8))
                  }
                  content.addView(list, lp(match, 0, 1f))

                  // --- поле ввода ---
                  val inputBar = LinearLayout(this).apply {
                      orientation = LinearLayout.HORIZONTAL
                      gravity = Gravity.CENTER_VERTICAL
                      setPadding(dpI(8), dpI(6), dpI(8), dpI(6))
                      background = glass(32f)
                  }
                  val msgInput = EditText(this).apply {
                      hint = "Сообщение"
                      setHintTextColor(col(0x80FFFFFF))
                      setTextColor(Color.WHITE)
                      textSize = 16f
                      background = null
                      inputType = InputType.TYPE_CLASS_TEXT or InputType.TYPE_TEXT_FLAG_MULTI_LINE or
                          InputType.TYPE_TEXT_FLAG_CAP_SENTENCES
                      maxLines = 4
                      setPadding(dpI(12), dpI(8), dpI(8), dpI(8))
                  }
                  val sendBtn = TextView(this).apply {
                      text = "↑"
                      textSize = 22f
                      setTextColor(Color.WHITE)
                      setTypeface(typeface, Typeface.BOLD)
                      gravity = Gravity.CENTER
                      background = GradientDrawable(
                          GradientDrawable.Orientation.TL_BR,
                          intArrayOf(col(0xFF4D7CFF), col(0xFFA05CFF))
                      ).apply {
                          shape = GradientDrawable.OVAL
                          setStroke(dpI(1), col(0x66FFFFFF))
                      }
                      isClickable = true
                      addPress()
                  }
                  inputBar.addView(msgInput, LinearLayout.LayoutParams(0, wrap, 1f))
                  inputBar.addView(sendBtn, lp(dpI(44), dpI(44), l = dpI(6)))
                  content.addView(inputBar, lp(match, wrap, t = dpI(8)))

                  setContentView(frame)

                  // --- сеть ---
                  node = PeerNode(
                      port = PORT,
                      onEvent = { text -> handleEvent(text) },
                      onMessage = { from, text, mine ->
                          addItem(if (mine) KIND_ME else KIND_OTHER, from, text)
                      }
                  )
                  node.myName = currentName(nameInput)

                  setConnVisible(true)
                  addItem(KIND_SYSTEM, "", "Добро пожаловать! Введите IP собеседника и нажмите «Подключить».")
                  node.start()

                  // --- обработчики ---
                  titleRow.setOnClickListener {
                      setConnVisible(connCard.visibility != View.VISIBLE)
                  }

                  nameInput.addTextChangedListener(object : TextWatcher {
                      override fun beforeTextChanged(s: CharSequence?, start: Int, count: Int, after: Int) {}
                      override fun onTextChanged(s: CharSequence?, start: Int, before: Int, count: Int) {}
                      override fun afterTextChanged(s: Editable?) {
                          node.myName = currentName(nameInput)
                          prefs.edit().putString("name", nameInput.text.toString().trim()).apply()
                      }
                  })

                  connectBtn.setOnClickListener {
                      val host = peerInput.text.toString().trim()
                      if (host.isEmpty()) {
                          addItem(KIND_SYSTEM, "", "Введите IP собеседника")
                          return@setOnClickListener
                      }
                      it.performHapticFeedback(HapticFeedbackConstants.VIRTUAL_KEY)
                      prefs.edit().putString("peer", host).apply()
                      node.myName = currentName(nameInput)
                      node.connect(host)
                  }

                  sendBtn.setOnClickListener {
                      val text = msgInput.text.toString().trim()
                      if (text.isEmpty()) return@setOnClickListener
                      if (text.length > MAX_LEN) {
                          addItem(KIND_SYSTEM, "", "Сообщение слишком длинное (максимум $MAX_LEN символов)")
                          return@setOnClickListener
                      }
                      it.performHapticFeedback(HapticFeedbackConstants.VIRTUAL_KEY)
                      node.myName = currentName(nameInput)
                      node.send(text)
                      msgInput.setText("")
                  }
              }

              // ---------- логика ----------

              private fun currentName(input: EditText): String =
                  input.text.toString().trim().ifBlank { "Аноним" }

              private fun handleEvent(text: String) {
                  if (text.startsWith("Слушаю")) return
                  addItem(KIND_SYSTEM, "", text)
              }

              private fun addItem(kind: Int, sender: String, text: String) {
                  runOnUiThread {
                      chat.items.add(ChatItem(kind, sender, text, timeFmt.format(Date())))
                      chat.notifyDataSetChanged()
                      updateStatus()
                  }
              }

              private fun setConnVisible(show: Boolean) {
                  connCard.visibility = if (show) View.VISIBLE else View.GONE
                  chevron.text = if (show) "▴" else "▾"
              }

              private fun updateStatus() {
                  if (!::node.isInitialized) return
                  val n = node.peerCount()
                  if (n > 0) {
                      statusPill.text = "● Онлайн · $n"
                      statusPill.setTextColor(col(0xFF7CFFB2))
                  } else {
                      statusPill.text = "● Ожидание"
                      statusPill.setTextColor(col(0xB3FFFFFF))
                  }
                  if (n > 0 && lastPeerCount == 0) setConnVisible(false)
                  if (n == 0 && lastPeerCount > 0) setConnVisible(true)
                  lastPeerCount = n
              }

              // ---------- пузыри сообщений ----------

              private inner class ChatAdapter : BaseAdapter() {
                  val items = ArrayList<ChatItem>()

                  override fun getCount(): Int = items.size
                  override fun getItem(position: Int): Any = items[position]
                  override fun getItemId(position: Int): Long = position.toLong()
                  override fun getView(position: Int, convertView: View?, parent: ViewGroup?): View =
                      buildRow(items[position])
              }

              private fun buildRow(item: ChatItem): View {
                  val match = ViewGroup.LayoutParams.MATCH_PARENT
                  val wrap = ViewGroup.LayoutParams.WRAP_CONTENT
                  val maxW = (resources.displayMetrics.widthPixels * 0.76f).toInt()

                  val row = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setPadding(dpI(2), dpI(3), dpI(2), dpI(3))
                  }

                  if (item.kind == KIND_SYSTEM) {
                      val tv = TextView(this).apply {
                          text = item.text
                          textSize = 12f
                          setTextColor(col(0xCCFFFFFF))
                          gravity = Gravity.CENTER
                          maxWidth = maxW
                          setPadding(dpI(12), dpI(5), dpI(12), dpI(5))
                          background = glass(14f, col(0x26FFFFFF), col(0x0DFFFFFF), col(0x33FFFFFF))
                      }
                      val params = LinearLayout.LayoutParams(wrap, wrap)
                      params.gravity = Gravity.CENTER_HORIZONTAL
                      params.topMargin = dpI(4)
                      params.bottomMargin = dpI(4)
                      row.addView(tv, params)
                  } else {
                      val mine = item.kind == KIND_ME
                      val bubble = LinearLayout(this).apply {
                          orientation = LinearLayout.VERTICAL
                          setPadding(dpI(14), dpI(9), dpI(14), dpI(7))
                          background = bubbleBg(mine)
                      }
                      if (!mine) {
                          val who = TextView(this).apply {
                              text = item.sender
                              textSize = 12f
                              setTypeface(typeface, Typeface.BOLD)
                              setTextColor(col(0xFF9FE8FF))
                              maxWidth = maxW - dpI(28)
                          }
                          bubble.addView(who, LinearLayout.LayoutParams(wrap, wrap))
                      }
                      val msg = TextView(this).apply {
                          text = item.text
                          textSize = 16f
                          setTextColor(Color.WHITE)
                          maxWidth = maxW - dpI(28)
                      }
                      bubble.addView(msg, LinearLayout.LayoutParams(wrap, wrap))
                      val time = TextView(this).apply {
                          text = item.time
                          textSize = 10f
                          setTextColor(col(0x99FFFFFF))
                          gravity = Gravity.END
                      }
                      bubble.addView(time, LinearLayout.LayoutParams(match, wrap))

                      val params = LinearLayout.LayoutParams(wrap, wrap)
                      params.gravity = if (mine) Gravity.END else Gravity.START
                      row.addView(bubble, params)
                  }
                  return row
              }

              // ---------- сеть ----------

              private fun localIps(): String {
                  return try {
                      val result = ArrayList<String>()
                      val ifaces = NetworkInterface.getNetworkInterfaces()
                      while (ifaces != null && ifaces.hasMoreElements()) {
                          val iface = ifaces.nextElement()
                          if (!iface.isUp || iface.isLoopback) continue
                          val addrs = iface.inetAddresses
                          while (addrs.hasMoreElements()) {
                              val a = addrs.nextElement()
                              if (a is Inet4Address && !a.isLoopbackAddress) {
                                  result.add(a.hostAddress ?: continue)
                              }
                          }
                      }
                      if (result.isEmpty()) "нет сети" else result.joinToString(", ")
                  } catch (e: Exception) {
                      "неизвестно"
                  }
              }

              override fun onDestroy() {
                  super.onDestroy()
                  node.stop()
              }
          }
          EOF

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Accept Android licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v${{ github.run_number }}" \
            app/build/outputs/apk/debug/app-debug.apk \
            --repo "${{ github.repository }}" \
            --target "${{ github.sha }}" \
            --title "P2P Chat build ${{ github.run_number }}" \
            --notes "Debug APK"
